# Produit l'installateur Windows et la version portable d'Ivoire-Gestion.
# A lancer depuis GitHub avec "Run workflow" quand une version doit etre remise
# a une entreprise, ou automatiquement a chaque poussee sur la branche Arena.

name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [arena/01a0c660-caisse-desktop]

jobs:
  build-windows:
    name: Installateur Windows
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-windows-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-windows-

      - name: Installation
        run: npm ci

      - name: Installer le binaire Electron
        run: npm run electron:install

      - name: Tests
        run: npm test -- --runInBand

      - name: Build executable Windows non installe
        run: npm run dist:windows:dir

      - name: Zipper le dossier executable
        shell: pwsh
        run: Compress-Archive -Path release/win-unpacked/* -DestinationPath release/Ivoire-Gestion-Windows-x64.zip -Force

      - name: Build installateur et portable
        id: installateur
        continue-on-error: true
        run: npm run dist:windows

      - name: Publier les executables
        uses: actions/upload-artifact@v4
        with:
          name: Ivoire-Gestion-Windows
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest*.yml
            release/win-unpacked/Ivoire-Gestion.exe
          if-no-files-found: error
          retention-days: 30

      # Publie une page de telechargement simple : un lien direct vers le .exe,
      # sans compte GitHub et sans archive de plusieurs centaines de Mo.
      - name: Publier la version telechargeable
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem release -Filter *.exe -File -ErrorAction SilentlyContinue
          if (-not $exe) {
            Write-Error "Aucun fichier .exe produit : rien a publier."
            exit 1
          }
          $chemins = $exe | ForEach-Object { $_.FullName }
          $exe | ForEach-Object { Write-Host ("A publier : " + $_.Name + "  " + [math]::Round($_.Length / 1MB) + " Mo") }
          gh release delete derniere-version --yes --cleanup-tag 2>$null
          gh release create derniere-version $chemins `
            --title "Ivoire-Gestion - derniere version Windows" `
            --notes "Installateur Windows 64 bits d'Ivoire-Gestion.

          Telechargez le fichier Ivoire-Gestion-Setup puis lancez-le.
          Identifiants de premiere connexion : CIV / CIV.

          Construit depuis le commit ${{ github.sha }}." `
            --latest

      - name: Signaler si l'installateur complet echoue
        if: steps.installateur.outcome == 'failure'
        run: echo "::warning::Le dossier executable a ete produit, mais la generation NSIS/portable doit etre relancee sur un poste Windows si aucun .exe d'installation n'est dans l'artefact."
